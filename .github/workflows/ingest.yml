name: Data Ingestion

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Ingestion Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npm run fetch-data

      - name: Commit updated JSON (Backup)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/conferences.json
          git commit -m "chore: data update [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Flush Redis cache + trigger ISR revalidation
        # Deletes the Redis key so the next request fetches fresh DB data,
        # then warms the cache and rebuilds the static homepage HTML.
        # Runs even if the git commit was a no-op (data may have changed in DB).
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://www.confscouting.com' }}
          CACHE_INVALIDATION_SECRET: ${{ secrets.CACHE_INVALIDATION_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -X POST "${APP_URL}/api/cache/invalidate" \
            -H "Authorization: Bearer ${CACHE_INVALIDATION_SECRET}" \
            -H "Content-Type: application/json" \
          && echo "Cache invalidated successfully" \
          || echo "Cache invalidation failed (non-fatal)"
